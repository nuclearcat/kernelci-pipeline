repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: validate-yaml-config
        name: Validate YAML config
        entry: python3 tests/validate_yaml.py
        language: system
        files: ^config/
        types: [yaml]
        pass_filenames: false
